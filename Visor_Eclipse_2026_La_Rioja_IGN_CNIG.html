<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="cnig" content="yes">

<title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

<!-- ===== CSS API‑IDEE ===== -->
<link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

<!-- ===== MOUSERSRS ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>

<!-- ===== LAYERSWITCHER ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
overflow: hidden;
display: flex;
flex-direction: column;
}
.map-wrapper {
position: relative;
width: 100%;
flex: 1;
}
#mapa {
width: 100%;
height: 100%;
}

/* ===== CABECERA IGN PROPORCIONAL ===== */
#cabecera-ign {
position: relative;
width: 100%;
z-index: 100;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 14px 18px;
box-sizing: border-box;
pointer-events: none;
gap: 12px;
background: #364b5f;
color: #fff;
text-align: center;
overflow: hidden;
}
#cabecera-ign::after {
content: "";
position: absolute;
left: 0;
right: 0;
bottom: 0;
height: 3px;
background: linear-gradient(to right, rgba(255,255,255,0.95), rgba(255,255,255,0.3), rgba(255,255,255,0.95));
}
#cabecera-ign > * {
pointer-events: auto;
}

@media (max-height: 50vw) {
#cabecera-ign {
height: 150px;
padding: 10px 12px;
}
}

/* BLOQUE 1: Logos arriba */
.header-logos {
display: flex;
justify-content: center;
align-items: center;
gap: 20px;
flex-wrap: wrap;
width: 100%;
}

/* BLOQUE 2: Botones y Texto abajo */
.header-bottom {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
flex-wrap: wrap;
width: 100%;
}

.logo1 {
height: 85px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.logo2 {
height: 50px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.titulo-ign {
background-color: rgba(255, 255, 255, 0.95);
padding: 8px 14px;
border-radius: 4px;
font-size: 15px;
font-weight: bold;
color: #333;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
text-align: center;
font-family: Arial, sans-serif;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
flex: 1;
min-width: 200px;
max-width: 400px;
}

@media (max-width: 800px) {
#cabecera-ign {
padding: 12px 14px;
gap: 10px;
}
.header-logos {
gap: 18px;
}
.header-bottom {
gap: 10px;
}
.logo1 {
height: 78px;
}
.logo2 {
height: 46px;
}
.titulo-ign {
font-size: 14px;
min-width: 180px;
max-width: 360px;
}
.btn-info-pdf,
.btn-alert-png {
width: 38px;
height: 38px;
}
}

@media (max-width: 700px) {
#cabecera-ign {
padding: 11px 13px;
}
.header-logos {
gap: 16px;
}
.header-bottom {
gap: 10px;
}
.logo1 {
height: 74px;
}
.logo2 {
height: 44px;
}
.titulo-ign {
font-size: 13px;
min-width: 170px;
max-width: 320px;
}
.btn-info-pdf,
.btn-alert-png {
width: 37px;
height: 37px;
}
}

@media (max-width: 600px) {
#cabecera-ign {
padding: 10px 12px;
}
.header-logos {
gap: 14px;
}
.header-bottom {
gap: 8px;
}
.logo1 {
height: 68px;
}
.logo2 {
height: 38px;
}
.titulo-ign {
font-size: 12px;
min-width: 150px;
max-width: 280px;
}
.btn-info-pdf,
.btn-alert-png {
width: 36px;
height: 36px;
}
}

@media (max-width: 500px) {
#cabecera-ign {
padding: 9px 11px;
}
.header-logos {
gap: 12px;
}
.header-bottom {
gap: 8px;
}
.logo1 {
height: 60px;
}
.logo2 {
height: 36px;
}
.titulo-ign {
font-size: 11px;
min-width: 140px;
max-width: 240px;
}
.btn-info-pdf,
.btn-alert-png {
width: 34px;
height: 34px;
}
}

@media (max-width: 400px) {
#cabecera-ign {
padding: 6px 8px;
gap: 6px;
}
.header-logos {
gap: 10px;
}
.header-bottom {
gap: 6px;
}
.logo1 {
height: 45px;
}
.logo2 {
height: 28px;
}
.titulo-ign {
font-size: 10px;
padding: 4px 8px;
min-width: 110px;
max-width: 180px;
white-space: normal;
line-height: 1.1;
}
.btn-info-pdf,
.btn-alert-png {
width: 32px;
height: 32px;
}
}

/* ===== BOTONES INFO Y ATENCIÓN ===== */
.btn-info-pdf,
.btn-alert-png {
width: 40px;
height: 40px;
border-radius: 50%;
background: #fff;
box-shadow: 0 4px 14px rgba(0,0,0,0.28);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
text-decoration: none;
cursor: pointer;
transition: transform 0.2s;
flex-shrink: 0;
}

.btn-info-pdf:hover,
.btn-alert-png:hover {
transform: scale(1.1);
}

.btn-info-pdf img,
.btn-alert-png img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}


</style>
</head>

<body>
<!-- ===== CABECERA INSTITUCIONAL ===== -->
<header id="cabecera-ign">
  <!-- BLOQUE 1: Logos -->
  <div class="header-logos">
    <img src="/source/Imagen_Dele.png" alt="Logo Delegación" class="logo1">
    <img src="/source/Imagen_IGN.png" alt="Logo IGN" class="logo2">
  </div>

  <!-- BLOQUE 2: Botón INFO + Texto + Botón ATENCIÓN -->
  <div class="header-bottom">
    <a href="/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Información PDF">
      <img src="/source/INFO.png" alt="Info">
    </a>
    <div class="titulo-ign">Servicio regional del IGN en La Rioja y Navarra</div>
    <a href="/source/advertencia_importante.png" target="_blank" class="btn-alert-png" title="Advertencia importante">
      <img src="/source/ATENCIÓN.png" alt="Atención">
    </a>
  </div>
</header>
<!-- ===== CONTENEDOR MAPA ===== -->
<div class="map-wrapper">
  <div id="mapa" class="m-container"></div>
</div>



<!-- ===== JS API‑IDEE (SIN CAMBIOS) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
const mapa = IDEE.map({
container: 'mapa',
zoom: 8,
minZoom: 8,
center: [-273000, 5220000], 
controls: ['location', 'rotate']
});

const CCAA_LR = new IDEE.layer.GeoJSON({
interactive: false,
name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
url: '/source/LA_RIOJA.geojson',
legend: 'CCAA La Rioja', 
}, 
{visibility: true, queryable: false}
);

const CCAA_NA = new IDEE.layer.GeoJSON({
interactive: false,
name: "COMUNIDAD AUTÓNOMA DE NAVARRA", 
url: '/source/NAVARRA.geojson',
legend: 'CCAA Navarra', 
}, 
{visibility: true, queryable: false}
);


const UMBRA = new IDEE.layer.GeoJSON({
interactive: false,
name: "UMBRA", 
url: '/source/UMBRA.geojson',
legend: 'UMBRA', 
}, 
{visibility: true, queryable: false}
);

CCAA_LR.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

CCAA_NA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'red', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

UMBRA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'gray', opacity: 0.3 }, stroke: { color: 'white', width: 0.5 } }
}));

CCAA_LR.setZIndex(20);
CCAA_NA.setZIndex(20);
UMBRA.setZIndex(20);
mapa.addLayers(CCAA_LR);
mapa.addLayers(CCAA_NA);
mapa.addLayers(UMBRA);


const capaCOG_LR = new IDEE.layer.GeoTIFF({    
url: '/source/La_Rioja_Sombra_COG_WM.tif',
name: 'Sombra La Rioja',
legend: 'Sombra La Rioja ECLIPSE 2026',
}, {visibility: true, opacity: 0.6 });
capaCOG_LR.setZIndex(10);
mapa.addLayers(capaCOG_LR);

const capaCOG_NA = new IDEE.layer.GeoTIFF({    
url: '/source/Navarra_Sombra_COG_WM.tif',
name: 'Sombra Navarra',
legend: 'Sombra Navarra ECLIPSE 2026',
}, { visibility: true, opacity: 0.6 });
capaCOG_NA.setZIndex(10);
mapa.addLayers(capaCOG_NA);

// ===== wmts =====
//const ORTO_MA = new IDEE.layer.WMTS({
//url: "https://www.ign.es/wmts/pnoa-ma",
//name: "OI.OrthoimageCoverage",
//matrixSet: "EPSG:25830",
//legend: "Ortofoto PNOA máxima actualidad",
//visibility: true
//},
//{
//  format: 'image/png'
//});
//ORTO_MA.setZIndex(1);
//mapa.addLayers(ORTO_MA);


mapa.addPlugin(new IDEE.plugin.MouseSRS({
position: 'BL',
srs: 'EPSG:4326',
label: 'WGS84 (lat, lon)',
precision: 4,
}));

const layerSwitcher = new IDEE.plugin.Layerswitcher({ 
collapsed: !0, 
position: "BL", 
collapsible: !0, 
isDraggable: !1, 
modeSelectLayers: "eyes", 
tools: ["transparency", "legend", "zoom", "style", "delete"], 
isMoveLayers: !0, 
https: !0, 
http: !0, 
showCatalog: !1 
});
mapa.addPlugin(layerSwitcher);

function toggleHeaderVisibility() {
  const header = document.getElementById('cabecera-ign');
  if (!header) return;
  const layerswitcherPanel = document.querySelector('.m-plugin-layerswitcher');
  if (!layerswitcherPanel) return;
  const isOpened = layerswitcherPanel.classList.contains('opened');
  header.style.display = isOpened ? 'none' : 'flex';
  header.style.visibility = isOpened ? 'hidden' : 'visible';
  header.style.pointerEvents = isOpened ? 'none' : 'auto';
}

const observer = new MutationObserver(toggleHeaderVisibility);
const panel = document.querySelector('.m-plugin-layerswitcher');
if (panel) {
  observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
}

window.addEventListener('load', function() {
  setTimeout(toggleHeaderVisibility, 100);
});
</script>
</body>
