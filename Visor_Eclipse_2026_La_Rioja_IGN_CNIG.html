<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="cnig" content="yes">

  <title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

  <!-- ===== CSS API‑IDEE ===== -->
  <link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

  <!-- ===== MOUSERSRS ===== -->
  <link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>
  
  <!-- ===== LAYERSWITCHER ===== -->
  <link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #mapa {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ===== CABECERA IGN CENTRADA Y RESPONSIVE ===== */
    #cabecera-ign {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between; /* Logo1 - Texto - Logo2 */
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      pointer-events: none; /* Permite clicks en el mapa a través de los huecos */
    }

    #cabecera-ign > * {
      pointer-events: auto; /* Reactiva clicks en los elementos de la cabecera */
    }

    .logo-img {
      height: 50px;
      width: auto;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .titulo-ign {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0 10px;
    }

    /* ===== BOTÓN PDF INFO (REDUCIDO Y COLORES INVERTIDOS) ===== */
    .btn-info-pdf {
      position: absolute;
      bottom: 110px;
      right: 20px;
      z-index: 1001;
      background-color: #007bff; /* Fondo Azul */
      border-radius: 50%;
      width: 46px; /* 4px más pequeño que antes (2px de radio menos) */
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s;
      border: 2px solid #ffffff; /* Borde Blanco */
      text-decoration: none;
    }

    .btn-info-pdf:hover {
      transform: scale(1.1);
      background-color: #0056b3;
    }

    .btn-info-pdf svg {
      width: 28px;
      height: 28px;
      fill: #ffffff; /* Icono Blanco */
    }

    /* ===== ADAPTACIÓN MÓVIL ===== */
    @media (max-width: 600px) {
      .titulo-ign {
        font-size: 11px; /* Texto reducido */
        padding: 5px 8px;
        line-height: 1.2;
        max-width: 40%;
      }
      .logo-img {
        height: 35px; /* Logos reducidos */
      }
      #cabecera-ign {
        top: 5px;
        padding: 0 5px;
      }
    }

  </style>
</head>

<body>

<!-- CONTENEDOR DEL MAPA -->
<div id="mapa" class="m-container"></div>

<!-- ===== CABECERA INSTITUCIONAL ===== -->
<div id="cabecera-ign">
  <!-- Logo Izquierda (Logo 1) -->
  <img src="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Imagen_Dele.png" alt="Logo 1" class="logo-img">

  <!-- Texto Centrado -->
  <div class="titulo-ign">
    Servicio regional del IGN en La Rioja y Navarra
  </div>

  <!-- Logo Derecha (Logo 2) -->
  <img src="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Imagen_IGN.png" alt="Logo 2" class="logo-img">
</div>

<!-- ===== BOTÓN DE INFORMACIÓN PDF ===== -->
<a href="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/informacion.pdf" target="_blank" class="btn-info-pdf" title="Ver guía del Eclipse">
  <svg viewBox="0 0 24 24">
    <path d="M11,9H13V7H11V9M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z" />
  </svg>
</a>


<!-- ===== JS API‑IDEE ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<!-- ===== PLUGINS ===== -->
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
/************************************************
 MAPA BASE
 ************************************************/
const mapa = IDEE.map({
  container: 'mapa',
  zoom: 9.5,
  minZoom: 9.5,
  center: [-273000, 5202000], 
  controls: [
    'scaleline',
    'location',
    'backgroundlayers'
  ]
});

/************************************************
 COG DIRECTO SOBRE EL MAPA
 ************************************************/
const capaCOG = new IDEE.layer.GeoTIFF(
  {    
    url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/La_Rioja_Sombra_COG_WM.tif',
    name: 'Sombra La Rioja',
    legend: 'Sombra La Rioja ECLIPSE 2026'
  },
  {
    visibility: true,
    opacity: 1
  }
);
capaCOG.setZIndex(10);
mapa.addLayers(capaCOG);

/************************************************
 GEOJSON CCAA
 ************************************************/
var CCAA = new IDEE.layer.GeoJSON(
  {
    name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
    url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/LA_RIOJA(web_mercator).geojson',
    legend: 'CCAA La Rioja', 
    visibility: true
});

let estilo_CCAA = new IDEE.style.Generic({
  polygon: {
    fill: { color: 'green', opacity: 0 },
    stroke: { color: '#FF0000', width: 3 }
  }
});
          
CCAA.setStyle(estilo_CCAA);
mapa.addLayers(CCAA);

/************************************************
 COORDENADAS MOUSERSRS
 ************************************************/
const mousesrs = new IDEE.plugin.MouseSRS({
  position: 'BL',
  tooltip: 'Muestra coordenadas',
  srs: 'EPSG:4326',
  label: 'WGS84 (lat, lon)',
  precision: 4,
});
mapa.addPlugin(mousesrs);

/************************************************
 Layerswitcher
 ************************************************/
const selectorcapas = new IDEE.plugin.Layerswitcher({ 
  collapsed: !0, 
  position: "TR", 
  collapsible: !0, 
  isDraggable: !1, 
  modeSelectLayers: "eyes", 
  tools: ["transparency", "legend", "zoom", "information", "style", "delete"], 
  isMoveLayers: !0, 
  https: !0, 
  http: !0, 
  showCatalog: !1 
});
mapa.addPlugin(selectorcapas);

</script>
</body>
</html>
