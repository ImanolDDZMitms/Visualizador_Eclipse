<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="cnig" content="yes">

<title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

<!-- ===== CSS API‑IDEE ===== -->
<link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

<!-- ===== MOUSERSRS ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>

<!-- ===== LAYERSWITCHER ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
overflow: hidden;
display: flex;
flex-direction: column;
}
.map-wrapper {
position: relative;
width: 100%;
flex: 1;
}
#mapa {
width: 100%;
height: 100%;
}

/* ===== CABECERA IGN AJUSTADA A LA IZQUIERDA ===== */
#cabecera-ign {
position: relative;
width: 100%;
z-index: 1000;
display: flex;
flex-wrap: wrap;
justify-content: center;
align-items: center;
padding: 14px 18px;
box-sizing: border-box;
pointer-events: none;
gap: 18px; /* Espacio entre el bloque Delegación e IGN */
background: #364b5f;
color: #fff;
text-align: center;
overflow: hidden;
}
#cabecera-ign::after {
content: "";
position: absolute;
left: 0;
right: 0;
bottom: 0;
height: 3px;
background: linear-gradient(to right, rgba(255,255,255,0.95), rgba(255,255,255,0.3), rgba(255,255,255,0.95));
}
.columna-izquierda,
.contenedor-ign-lateral {
justify-content: center;
align-items: center;
text-align: center;
}
#cabecera-ign > * {
pointer-events: auto;
}

#cabecera-ign > * {
pointer-events: auto;
}

/* Contenedor Izquierdo: Logo Delegación + Botón PDF */
.columna-izquierda {
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
}

/* Contenedor central (ahora lateral): Logo IGN y Texto */
.contenedor-ign-lateral {
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
margin-top: 5px;
}

.logo1 {
height: 95px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.logo2 {
height: 55px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.titulo-ign {
background-color: rgba(255, 255, 255, 0.95);
padding: 8px 15px;
border-radius: 4px;
font-size: 16px;
font-weight: bold;
color: #333;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
text-align: center;
font-family: Arial, sans-serif;
white-space: nowrap; /* Evita que el texto se parta si hay espacio */
}

/* ===== BOTÓN PDF INFO ===== */
.btn-info-pdf {
display: block;
width: 42px; 
height: 42px;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
cursor: pointer;
transition: transform 0.2s;
text-decoration: none;
border-radius: 50%; 
overflow: hidden; 
}

.btn-info-pdf img {
width: 100%;
height: 100%;
object-fit: cover; 
display: block;
}

.btn-info-pdf:hover,
.btn-alert-png:hover {
transform: scale(1.1);
}

.button-overlay {
position: absolute;
top: 14px;
left: 14px;
display: flex;
flex-direction: column;
gap: 10px;
z-index: 1100;
}

.button-overlay a {
width: 48px;
height: 48px;
border-radius: 50%;
background: #fff;
box-shadow: 0 4px 14px rgba(0,0,0,0.28);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
text-decoration: none;
}

.button-overlay img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

@media (max-width: 900px) {
#cabecera-ign {
padding: 12px 14px;
gap: 14px;
}
.logo1 {
height: 80px;
}
.logo2 {
height: 42px;
}
.titulo-ign {
font-size: 14px;
padding: 6px 12px;
}
.button-overlay {
top: 12px;
left: 12px;
}
.button-overlay a {
width: 44px;
height: 44px;
}
}

@media (max-width: 600px) {
#cabecera-ign {
justify-content: center;
align-items: flex-start;
}
.columna-izquierda,
.contenedor-ign-lateral {
width: 100%;
align-items: flex-start;
}
.logo1 {
height: 68px;
}
.logo2 {
height: 36px;
}
.titulo-ign {
font-size: 12px;
padding: 5px 10px;
white-space: normal;
}
#btn-pdf-info {
width: 40px;
height: 40px;
top: 10px;
left: 10px;
}
}

</style>
</head>

<body>
<!-- ===== CABECERA INSTITUCIONAL ===== -->
<header id="cabecera-ign">

<!-- Bloque 1: Delegación -->
    <div class="columna-izquierda">
    <img src="/source/Imagen_Dele.png" alt="Logo Delegación" class="logo1">
    </div>

<!-- Bloque 2: IGN (Logo + Texto) al lado de la Delegación -->
    <div class="contenedor-ign-lateral">
    <img src="/source/Imagen_IGN.png" alt="Logo IGN" class="logo2">
    <div class="titulo-ign"> Servicio regional del IGN en La Rioja y Navarra </div>
    </div>
</header>
<!-- ===== CONTENEDOR MAPA ===== -->
<div class="map-wrapper">
  <div id="mapa" class="m-container"></div>
  <div class="button-overlay">
    <a href="/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Información PDF">
      <img src="/source/INFO.png" alt="Info">
    </a>
    <a href="/source/advertencia_importante.png" target="_blank" class="btn-alert-png" title="Advertencia importante">
      <img src="/source/ATENCIÓN.png" alt="Atención">
    </a>
  </div>
</div>



<!-- ===== JS API‑IDEE (SIN CAMBIOS) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
const mapa = IDEE.map({
container: 'mapa',
zoom: 8,
minZoom: 8,
center: [-273000, 5220000], 
controls: ['location', 'rotate']
});

const CCAA_LR = new IDEE.layer.GeoJSON({
name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
url: '/source/LA_RIOJA.geojson',
legend: 'CCAA La Rioja', 
visibility: true
});

const CCAA_NA = new IDEE.layer.GeoJSON({
name: "COMUNIDAD AUTÓNOMA DE NAVARRA", 
url: '/source/NAVARRA.geojson',
legend: 'CCAA Navarra', 
visibility: true
});

const UMBRA = new IDEE.layer.GeoJSON({
name: "UMBRA", 
url: '/source/UMBRA.geojson',
legend: 'Umbria', 
visibility: true
});

CCAA_LR.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

CCAA_NA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'red', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

UMBRA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'gray', opacity: 0.3 }, stroke: { color: 'white', width: 0.5 } }
}));

CCAA_LR.setZIndex(20);
CCAA_NA.setZIndex(20);
UMBRA.setZIndex(20);
mapa.addLayers(CCAA_LR);
mapa.addLayers(CCAA_NA);
mapa.addLayers(UMBRA);


const capaCOG_LR = new IDEE.layer.GeoTIFF({    
url: '/source/La_Rioja_Sombra_COG_WM.tif',
name: 'Sombra La Rioja',
legend: 'Sombra La Rioja ECLIPSE 2026'
}, { visibility: true, opacity: 0.6 });
capaCOG_LR.setZIndex(10);
mapa.addLayers(capaCOG_LR);

const capaCOG_NA = new IDEE.layer.GeoTIFF({    
url: '/source/Navarra_Sombra_COG_WM.tif',
name: 'Sombra Navarra',
legend: 'Sombra Navarra ECLIPSE 2026'
}, { visibility: true, opacity: 0.6 });
capaCOG_NA.setZIndex(10);
mapa.addLayers(capaCOG_NA);


const ORTO_MA = new IDEE.layer.WMTS({
url: "http://www.ign.es/wmts/pnoa-ma",
name: "OI.OrthoimageCoverage",
matrixSet: "EPSG:25830",
legend: "Ortofoto PNOA máxima actualidad"
},
{
  format: 'image/png'
});
ORTO_MA.setZIndex(1);
mapa.addWMTS(ORTO_MA);


mapa.addPlugin(new IDEE.plugin.MouseSRS({
position: 'BL',
srs: 'EPSG:4326',
label: 'WGS84 (lat, lon)',
precision: 4,
}));

const layerSwitcher = new IDEE.plugin.Layerswitcher({ 
collapsed: !0, 
position: "BL", 
collapsible: !0, 
isDraggable: !1, 
modeSelectLayers: "eyes", 
tools: ["transparency", "legend", "zoom", "information", "style", "delete"], 
isMoveLayers: !0, 
https: !0, 
http: !0, 
showCatalog: !1 
});
mapa.addPlugin(layerSwitcher);

function toggleHeaderVisibility() {
  const header = document.getElementById('cabecera-ign');
  if (!header) return;
  const layerswitcherPanel = document.querySelector('.m-plugin-layerswitcher');
  if (!layerswitcherPanel) return;
  const isOpened = layerswitcherPanel.classList.contains('opened');
  header.style.display = isOpened ? 'none' : 'flex';
}

const observer = new MutationObserver(toggleHeaderVisibility);
const panel = document.querySelector('.m-plugin-layerswitcher');
if (panel) {
  observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
}

window.addEventListener('load', toggleHeaderVisibility);
</script>
</body>
