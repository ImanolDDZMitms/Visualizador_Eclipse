<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="cnig" content="yes">

<title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

<!-- ===== CSS API‑IDEE ===== -->
<link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

<!-- ===== MOUSERSRS ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>

<!-- ===== LAYERSWITCHER ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
overflow: hidden;
}
#mapa {
width: 100%;
height: 100vh;
position: absolute;
top: 0;
left: 0;
}

/* ===== CABECERA IGN AJUSTADA A LA IZQUIERDA ===== */
#cabecera-ign {
position: absolute;
top: 10px;
left: 0;
width: 100%;
z-index: 1000;
display: flex;
justify-content: flex-start; /* Alineado a la izquierda */
align-items: flex-start; 
padding: 0 15px;
box-sizing: border-box;
pointer-events: none;
gap: 20px; /* Espacio entre el bloque Delegación e IGN */
}

#cabecera-ign > * {
pointer-events: auto;
}

/* Contenedor Izquierdo: Logo Delegación + Botón PDF */
.columna-izquierda {
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
}

/* Contenedor central (ahora lateral): Logo IGN y Texto */
.contenedor-ign-lateral {
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
margin-top: 5px;
}

.logo1 {
height: 95px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.logo2 {
height: 55px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.titulo-ign {
background-color: rgba(255, 255, 255, 0.95);
padding: 8px 15px;
border-radius: 4px;
font-size: 16px;
font-weight: bold;
color: #333;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
text-align: center;
font-family: Arial, sans-serif;
white-space: nowrap; /* Evita que el texto se parta si hay espacio */
}

/* ===== BOTÓN PDF INFO ===== */
.btn-info-pdf {
display: block;
width: 42px; 
height: 42px;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
cursor: pointer;
transition: transform 0.2s;
text-decoration: none;
border-radius: 50%; 
overflow: hidden; 
}

.btn-info-pdf img {
width: 100%;
height: 100%;
object-fit: cover; 
display: block;
}

.btn-info-pdf:hover {
transform: scale(1.1);
}

/* ===== ADAPTACIÓN MÓVIL ===== */
@media (max-width: 600px) {
#cabecera-ign {
gap: 10px;
}
.titulo-ign {
font-size: 10px;
padding: 4px 8px;
white-space: normal; /* En móvil sí permitimos que baje de línea si es muy largo */
max-width: 150px;
}
.logo1 {
height: 60px;
}
.logo2 {
height: 40px;
}
.btn-info-pdf {
width: 36px;
height: 36px;
}
}

</style>
</head>

<body>

<div id="mapa" class="m-container"></div>

<!-- ===== CABECERA INSTITUCIONAL ===== -->
<div id="cabecera-ign">

<!-- Bloque 1: Delegación y PDF -->
<div class="columna-izquierda">
<img src="/source/Imagen_Dele.png" alt="Logo Delegación" class="logo1">

<a href="/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Información PDF">
<img src="/source/INFO.png" alt="Info">
</a>
</div>

<!-- Bloque 2: IGN (Logo + Texto) al lado de la Delegación -->
<div class="contenedor-ign-lateral">
<img src="/source/Imagen_IGN.png" alt="Logo IGN" class="logo2">
<div class="titulo-ign">
Servicio regional del IGN en La Rioja y Navarra
</div>
</div>

</div>


<!-- ===== JS API‑IDEE (SIN CAMBIOS) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
const mapa = IDEE.map({
container: 'mapa',
zoom: 9.5,
minZoom: 9.5,
center: [-273000, 5220000], 
controls: ['scaleline', 'location', 'rotate']
});

const CCAA = new IDEE.layer.GeoJSON({
name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
url: '/source/LA_RIOJA(web_mercator).geojson',
legend: 'CCAA La Rioja', 
visibility: true
});

CCAA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: '#FF0000', width: 3 } }
}));

CCAA.setZIndex(20);
mapa.addLayers(CCAA);



const capaCOG = new IDEE.layer.GeoTIFF({    
url: '/source/La_Rioja_Sombra_COG_WM.tif',
name: 'Sombra La Rioja',
legend: 'Sombra La Rioja ECLIPSE 2026'
}, { visibility: true, opacity: 1 });
capaCOG.setZIndex(10);
mapa.addLayers(capaCOG);


const ORTO_MA = new IDEE.layer.WMS({
url: 'https://www.ign.es/wms-inspire/pnoa-ma?',
name: 'OI.OrthoimageCoverage',
legend: 'Ortofoto PNOA máxima actualidad',
maxZoom: 20,
minZoom: 6,
visibility: true,
tiled: false
}, { visibility: true, opacity: 1 });
ORTO_MA.setZIndex(1);
mapa.addLayers(ORTO_MA);

mapa.addPlugin(new IDEE.plugin.MouseSRS({
position: 'BL',
srs: 'EPSG:4326',
label: 'WGS84 (lat, lon)',
precision: 4,
}));

mapa.addPlugin(new IDEE.plugin.Layerswitcher({ 
collapsed: !0, 
position: "TR", 
collapsible: !0, 
isDraggable: !1, 
modeSelectLayers: "eyes", 
tools: ["transparency", "legend", "zoom", "information", "style", "delete"], 
isMoveLayers: !0, 
https: !0, 
http: !0, 
showCatalog: !1 
}));
</script>
</body>
