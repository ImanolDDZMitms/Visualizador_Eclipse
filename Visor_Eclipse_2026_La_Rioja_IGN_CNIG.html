<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="cnig" content="yes">

  <title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

  <!-- ===== CSS API‑IDEE ===== -->
  <link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

  <!-- ===== MOUSERSRS ===== -->
  <link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>
  
  <!-- ===== LAYERSWITCHER ===== -->
  <link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    /* Asegura que el contenedor ocupe toda la pantalla */
    #mapa {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ===== CABECERA IGN ===== */
    #cabecera-ign {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Arial, sans-serif;
      max-width: calc(100vw - 20px);
    }

    .titulo-ign {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    /* ===== BOTÓN PDF INFO ===== */
    .btn-info-pdf {
      position: absolute;
      bottom: 110px; /* Ajustado para que no tape la escala o el logo del IGN */
      right: 20px;
      z-index: 1001;
      background-color: #ffffff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      border: 2px solid #007bff;
      text-decoration: none;
    }

    .btn-info-pdf:hover {
      transform: scale(1.1);
      background-color: #f0f7ff;
    }

    .btn-info-pdf svg {
      width: 30px;
      height: 30px;
      fill: #007bff;
    }

    /* Tooltip simple al pasar el ratón */
    .btn-info-pdf::after {
      content: "Más información (PDF)";
      position: absolute;
      right: 60px;
      background: #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      font-family: Arial, sans-serif;
    }

    .btn-info-pdf:hover::after {
      opacity: 1;
    }

  </style>
</head>

<body>

<!-- CONTENEDOR DEL MAPA -->
<div id="mapa" class="m-container"></div>

<!-- ===== CABECERA INSTITUCIONAL ===== -->
<div id="cabecera-ign">
  <div class="titulo-ign">
    Servicio regional del IGN en La Rioja y Navarra
  </div>
</div>

<!-- ===== BOTÓN DE INFORMACIÓN PDF ===== -->
<a href="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Ver guía del Eclipse">
  <svg viewBox="0 0 24 24">
    <path d="M11,9H13V7H11V9M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z" />
  </svg>
</a>


<!-- ===== JS API‑IDEE ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<!-- ===== PLUGINS ===== -->
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
/************************************************
 MAPA BASE
 ************************************************/
const mapa = IDEE.map({
  container: 'mapa',
  zoom: 9.5,
  minZoom: 9.5,
  center: [-273000, 5202000], // La Rioja (EPSG:3857)
  controls: [
    'scaleline',
    'location',
    'backgroundlayers'
  ]
});

/************************************************
 COG DIRECTO SOBRE EL MAPA
 ************************************************/
const capaCOG = new IDEE.layer.GeoTIFF(
  {    
    url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/La_Rioja_Sombra_COG_WM.tif',
    name: 'Sombra La Rioja',
    legend: 'Sombra La Rioja ECLIPSE 2026'
  },
  {
    visibility: true,
    opacity: 1
  }
);
capaCOG.setZIndex(10);
mapa.addLayers(capaCOG);

/************************************************
 GEOJSON CCAA
 ************************************************/
var CCAA = new IDEE.layer.GeoJSON(
  {
    name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
    url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/LA_RIOJA(web_mercator).geojson',
    legend: 'CCAA La Rioja', 
    visibility: true
});

let estilo_CCAA = new IDEE.style.Generic({
  polygon: {
    fill: { color: 'green', opacity: 0 },
    stroke: { color: '#FF0000', width: 3 }
  }
});
          
CCAA.setStyle(estilo_CCAA);
mapa.addLayers(CCAA);

/************************************************
 COORDENADAS MOUSERSRS
 ************************************************/
const mousesrs = new IDEE.plugin.MouseSRS({
  position: 'BL',
  tooltip: 'Muestra coordenadas',
  srs: 'EPSG:4326',
  label: 'WGS84 (lat, lon)',
  precision: 4,
});
mapa.addPlugin(mousesrs);

/************************************************
 Layerswitcher
 ************************************************/
const selectorcapas = new IDEE.plugin.Layerswitcher({ 
  collapsed: !0, 
  position: "TR", 
  collapsible: !0, 
  isDraggable: !1, 
  modeSelectLayers: "eyes", 
  tools: ["transparency", "legend", "zoom", "information", "style", "delete"], 
  isMoveLayers: !0, 
  https: !0, 
  http: !0, 
  showCatalog: !1 
});
mapa.addPlugin(selectorcapas);

</script>
</body>
</html>
