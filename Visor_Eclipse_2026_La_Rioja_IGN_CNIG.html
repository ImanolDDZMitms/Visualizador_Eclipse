<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="cnig" content="yes">

<title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

<!-- ===== CSS API‑IDEE ===== -->
<link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

<!-- ===== MOUSERSRS ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>

<!-- ===== LAYERSWITCHER ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />
<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
overflow: hidden;
display: flex;
flex-direction: column;
}
.map-wrapper {
position: relative;
width: 100%;
flex: 1;
}
#mapa {
width: 100%;
height: 100%;
}

/* ===== CABECERA IGN PROPORCIONAL ===== */
#cabecera-ign {
position: relative;
width: 100%;
z-index: 100;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 14px 18px;
box-sizing: border-box;
pointer-events: none;
gap: 12px;
background: #364b5f;
color: #fff;
text-align: center;
overflow: hidden;
}
#cabecera-ign::after {
content: "";
position: absolute;
left: 0;
right: 0;
bottom: 0;
height: 3px;
background: linear-gradient(to right, rgba(255,255,255,0.95), rgba(255,255,255,0.3), rgba(255,255,255,0.95));
}
#cabecera-ign > * {
pointer-events: auto;
}


/* BLOQUE 1: Logos arriba */
.header-logos {
display: flex;
justify-content: center;
align-items: center;
gap: 20px;
flex-wrap: wrap;
width: 100%;
}

/* BLOQUE 2: Botones y Texto abajo */
.header-bottom {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
flex-wrap: wrap;
width: 100%;
}

.logo1 {
height: 85px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.logo2 {
height: 50px; 
width: auto;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.titulo-ign {
background-color: rgba(255, 255, 255, 0.95);
padding: 8px 14px;
border-radius: 4px;
font-size: 15px;
font-weight: bold;
color: #333;
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
text-align: center;
font-family: Arial, sans-serif;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
flex: 1;
min-width: 200px;
max-width: 400px;
}


/* ===== BOTONES INFO Y ATENCIÓN ===== */
.btn-info-pdf,
.btn-alert-png {
width: 40px;
height: 40px;
border-radius: 50%;
background: #fff;
box-shadow: 0 4px 14px rgba(0,0,0,0.28);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
text-decoration: none;
cursor: pointer;
transition: transform 0.2s;
flex-shrink: 0;
}

.btn-info-pdf:hover,
.btn-alert-png:hover {
transform: scale(1.1);
}

.btn-info-pdf img,
.btn-alert-png img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

/* Valores base (estos serían los estilos para pantallas > 800px, por ejemplo) */
#cabecera-ign {
    padding: 2.0vw 2.5vw; /* Equivalente a ~20px 25px en una pantalla grande */
    gap: 2.0vw;
    display: flex; /* Asegura que Flexbox funcione */
    align-items: center; /* Centra verticalmente los elementos */
    justify-content: space-between; /* O como necesites */
    background-color: #f0f0f0; /* Ejemplo */
}
.header-logos {
    display: flex;
    align-items: center;
    gap: 3.0vw;
}
.header-bottom {
    display: flex;
    align-items: center;
    gap: 2.0vw;
}
.logo1 {
    height: 7.5vh; /* Aproximadamente 80px en un viewport de 1000px de altura */
}
.logo2 {
    height: 4.5vh; /* Aproximadamente 48px */
}
.titulo-ign {
    font-size: 1.5vw; /* Aproximadamente 16px */
    padding: 0.8vw 1.5vw;
    min-width: 18vw;
    max-width: 35vw;
    white-space: nowrap; /* Por defecto */
    line-height: 1.3;
    background-color: #e0e0e0; /* Ejemplo */
    border-radius: 5px;
}
.btn-info-pdf,
.btn-alert-png {
    width: 4.5vw;
    height: 4.5vw;
    min-width: 45px; /* Evita que se hagan demasiado pequeños */
    min-height: 45px;
    background-color: #007bff; /* Ejemplo */
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

/* Media Query para max-width: 800px */
@media (max-width: 800px) {
    #cabecera-ign {
        padding: 1.5vw 1.8vw; /* Un poco más pequeño */
        gap: 1.5vw;
    }
    .header-logos {
        gap: 2.5vw;
    }
    .header-bottom {
        gap: 1.5vw;
    }
    .logo1 {
        height: 7vh; /* Ligeramente más pequeño */
    }
    .logo2 {
        height: 4vh;
    }
    .titulo-ign {
        font-size: 1.4vw;
        padding: 0.7vw 1.4vw;
        min-width: 17vw;
        max-width: 32vw;
    }
    .btn-info-pdf,
    .btn-alert-png {
        width: 4.2vw;
        height: 4.2vw;
        min-width: 42px;
        min-height: 42px;
    }
}

/* Media Query para max-width: 700px */
@media (max-width: 700px) {
    #cabecera-ign {
        padding: 1.2vw 1.5vw;
        gap: 1.2vw;
    }
    .header-logos {
        gap: 2.2vw;
    }
    .header-bottom {
        gap: 1.2vw;
    }
    .logo1 {
        height: 6.5vh;
    }
    .logo2 {
        height: 3.8vh;
    }
    .titulo-ign {
        font-size: 1.3vw;
        padding: 0.6vw 1.3vw;
        min-width: 16vw;
        max-width: 30vw;
    }
    .btn-info-pdf,
    .btn-alert-png {
        width: 4vw;
        height: 4vw;
        min-width: 40px;
        min-height: 40px;
    }
}

/* Media Query para max-width: 600px */
/* Basado en tu ejemplo original de 600px */
@media (max-width: 600px) {
    #cabecera-ign {
        padding: 1.3vw 1.7vw; /* Ajustado para ser más responsivo, antes 8px 10px */
        gap: 1.3vw; /* Antes 8px */
    }
    .header-logos {
        gap: 2vw; /* Antes 12px */
    }
    .header-bottom {
        gap: 1.3vw; /* Antes 8px */
    }
    .logo1 {
        height: 6.0vh; /* Antes 55px */
    }
    .logo2 {
        height: 3.5vh; /* Antes 34px */
    }
    .titulo-ign {
        font-size: 1.8vw; /* Ajustado para que sea legible, antes 11px */
        padding: 0.8vw 1.7vw; /* Antes 5px 10px */
        min-width: 23vw; /* Antes 140px */
        max-width: 42vw; /* Antes 250px */
        white-space: normal;
        line-height: 1.2;
    }
    .btn-info-pdf,
    .btn-alert-png {
        width: 6vw; /* Antes 36px */
        height: 6vw; /* Antes 36px */
        min-width: 36px; /* Mantener un mínimo */
        min-height: 36px;
    }
}

/* Media Query para max-width: 500px */
@media (max-width: 500px) {
    #cabecera-ign {
        padding: 1.1vw 1.4vw;
        gap: 1.1vw;
    }
    .header-logos {
        gap: 1.8vw;
    }
    .header-bottom {
        gap: 1.1vw;
    }
    .logo1 {
        height: 5.5vh;
    }
    .logo2 {
        height: 3.2vh;
    }
    .titulo-ign {
        font-size: 1.9vw;
        padding: 0.7vw 1.4vw;
        min-width: 25vw;
        max-width: 45vw;
        white-space: normal;
        line-height: 1.2;
    }
    .btn-info-pdf,
    .btn-alert-png {
        width: 6.5vw;
        height: 6.5vw;
        min-width: 34px;
        min-height: 34px;
    }
}

/* Media Query para max-width: 400px */
/* Basado en tu ejemplo original de 400px */
@media (max-width: 400px) {
    #cabecera-ign {
        padding: 1.5vw 2vw; /* Ajustado para ser más responsivo, antes 6px 8px */
        gap: 1.5vw; /* Antes 6px */
    }
    .header-logos {
        gap: 5vw; /* Antes 20px */
    }
    .header-bottom {
        gap: 3.75vw; /* Antes 15px */
    }
    .logo1 {
        height: 5.0vh; /* Antes 45px */
    }
    .logo2 {
        height: 2.8vh; /* Antes 28px */
    }
    .titulo-ign {
        font-size: 2.2vw; /* Ajustado para que sea legible, antes 10px */
        padding: 1vw 2vw; /* Antes 4px 8px */
        min-width: 27.5vw; /* Antes 110px */
        max-width: 45vw; /* Antes 180px */
        white-space: normal;
        line-height: 1.1;
    }
    .btn-info-pdf,
    .btn-alert-png {
        width: 8vw; /* Antes 32px */
        height: 8vw; /* Antes 32px */
        min-width: 32px;
        min-height: 32px;
    }
}



</style>
</head>

<body>
<!-- ===== CABECERA INSTITUCIONAL ===== -->
<header id="cabecera-ign">
  <!-- BLOQUE 1: Logos -->
  <div class="header-logos">
    <img src="/source/Imagen_Dele.png" alt="Logo Delegación" class="logo1">
    <img src="/source/Imagen_IGN.png" alt="Logo IGN" class="logo2">
  </div>

  <!-- BLOQUE 2: Botón INFO + Texto + Botón ATENCIÓN -->
  <div class="header-bottom">
    <a href="/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Información PDF">
      <img src="/source/INFO.png" alt="Info">
    </a>
    <div class="titulo-ign">Servicio regional del IGN en La Rioja y Navarra</div>
    <a href="/source/advertencia_importante.png" target="_blank" class="btn-alert-png" title="Advertencia importante">
      <img src="/source/ATENCIÓN.png" alt="Atención">
    </a>
  </div>
</header>
<!-- ===== CONTENEDOR MAPA ===== -->
<div class="map-wrapper">
  <div id="mapa" class="m-container"></div>
</div>



<!-- ===== JS API‑IDEE (SIN CAMBIOS) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
const mapa = IDEE.map({
container: 'mapa',
zoom: 8,
minZoom: 8,
center: [-273000, 5220000], 
controls: ['location', 'rotate']
});

const CCAA_LR = new IDEE.layer.GeoJSON({
interactive: false,
name: "COMUNIDAD AUTÓNOMA DE LA RIOJA", 
url: '/source/LA_RIOJA.geojson',
legend: 'CCAA La Rioja', 
}, 
{visibility: true, queryable: false}
);

const CCAA_NA = new IDEE.layer.GeoJSON({
interactive: false,
name: "COMUNIDAD AUTÓNOMA DE NAVARRA", 
url: '/source/NAVARRA.geojson',
legend: 'CCAA Navarra', 
}, 
{visibility: true, queryable: false}
);


const UMBRA = new IDEE.layer.GeoJSON({
interactive: false,
name: "UMBRA", 
url: '/source/UMBRA.geojson',
legend: 'UMBRA', 
}, 
{visibility: true, queryable: false}
);

CCAA_LR.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

CCAA_NA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'red', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

UMBRA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'gray', opacity: 0.3 }, stroke: { color: 'white', width: 0.5 } }
}));

CCAA_LR.setZIndex(20);
CCAA_NA.setZIndex(20);
UMBRA.setZIndex(20);
mapa.addLayers(CCAA_LR);
mapa.addLayers(CCAA_NA);
mapa.addLayers(UMBRA);


const capaCOG_LR = new IDEE.layer.GeoTIFF({    
url: '/source/La_Rioja_Sombra_COG_WM.tif',
name: 'Sombra La Rioja',
legend: 'Sombra La Rioja ECLIPSE 2026',
}, {visibility: true, opacity: 0.6 });
capaCOG_LR.setZIndex(10);
mapa.addLayers(capaCOG_LR);

const capaCOG_NA = new IDEE.layer.GeoTIFF({    
url: '/source/Navarra_Sombra_COG_WM.tif',
name: 'Sombra Navarra',
legend: 'Sombra Navarra ECLIPSE 2026',
}, { visibility: true, opacity: 0.6 });
capaCOG_NA.setZIndex(10);
mapa.addLayers(capaCOG_NA);

// ===== wmts =====
//const ORTO_MA = new IDEE.layer.WMTS({
//url: "https://www.ign.es/wmts/pnoa-ma",
//name: "OI.OrthoimageCoverage",
//matrixSet: "EPSG:25830",
//legend: "Ortofoto PNOA máxima actualidad",
//visibility: true
//},
//{
//  format: 'image/png'
//});
//ORTO_MA.setZIndex(1);
//mapa.addLayers(ORTO_MA);


mapa.addPlugin(new IDEE.plugin.MouseSRS({
position: 'BL',
srs: 'EPSG:4326',
label: 'WGS84 (lat, lon)',
precision: 4,
}));

const layerSwitcher = new IDEE.plugin.Layerswitcher({ 
collapsed: !0, 
position: "BL", 
collapsible: !0, 
isDraggable: !1, 
modeSelectLayers: "eyes", 
tools: ["transparency", "legend", "zoom", "style", "delete"], 
isMoveLayers: !0, 
https: !0, 
http: !0, 
showCatalog: !1 
});
mapa.addPlugin(layerSwitcher);

function toggleHeaderVisibility() {
  const header = document.getElementById('cabecera-ign');
  if (!header) return;
  const layerswitcherPanel = document.querySelector('.m-plugin-layerswitcher');
  if (!layerswitcherPanel) return;
  const isOpened = layerswitcherPanel.classList.contains('opened');
  header.style.display = isOpened ? 'none' : 'flex';
  header.style.visibility = isOpened ? 'hidden' : 'visible';
  header.style.pointerEvents = isOpened ? 'none' : 'auto';
}

const observer = new MutationObserver(toggleHeaderVisibility);
const panel = document.querySelector('.m-plugin-layerswitcher');
if (panel) {
  observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
}

window.addEventListener('load', function() {
  setTimeout(toggleHeaderVisibility, 100);
});
</script>
</body>
