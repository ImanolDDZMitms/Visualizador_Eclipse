<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="cnig" content="yes">

<title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

<!-- ===== CSS API‑IDEE ===== -->
<link  href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>

<!-- ===== LAYERSWITCHER ===== -->
<link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />

<!-- ===== MY STYLES ===== -->
<link href="/style/styles.css" rel="stylesheet" />
</head>

<body>
<!-- ===== CABECERA INSTITUCIONAL ===== -->
<header id="cabecera-ign">
  <!-- BLOQUE 1: Logos -->
  <div class="header-logos">
    <img src="/source/Imagen_Dele.png" alt="Logo Delegación" class="logo1">
    <img src="/source/Imagen_IGN.png" alt="Logo IGN" class="logo2">
  </div>

  <!-- BLOQUE 2: Botón INFO + Texto + Botón ATENCIÓN -->
  <div class="header-bottom">
    <a href="/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-info-pdf" title="Información PDF">
      <img src="/source/INFO.png" alt="Info">
    </a>
    <div class="titulo-ign">Servicio regional del IGN en La Rioja y Navarra</div>
    <a href="/source/advertencia_importante.png" target="_blank" class="btn-alert-png" title="Advertencia importante">
      <img src="/source/ATENCIÓN.png" alt="Atención">
    </a>
  </div>
</header>
<!-- ===== CONTENEDOR MAPA ===== -->
<div class="map-wrapper">
  <div id="mapa" class="m-container"></div>
</div>



<!-- ===== JS API‑IDEE (SIN CAMBIOS) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
const mapa = IDEE.map({
container: 'mapa',
zoom: 8,
minZoom: 8,
center: [-273000, 5220000], 
controls: ['location', 'rotate'],
});

const capaCOG_LR = new IDEE.layer.GeoTIFF({    
url: '/source/La_Rioja_Sombra_COG_WM.tif',
name: 'Sombra La Rioja',
legend: 'Sombra La Rioja ECLIPSE 2026',
}, {visibility: true, opacity: 0.6 });
capaCOG_LR.setZIndex(10);
mapa.addLayers(capaCOG_LR);

const capaCOG_NA = new IDEE.layer.GeoTIFF({    
url: '/source/Navarra_Sombra_COG_WM.tif',
name: 'Sombra Navarra',
legend: 'Sombra Navarra ECLIPSE 2026',
}, { visibility: true, opacity: 0.6 });
capaCOG_NA.setZIndex(10);
mapa.addLayers(capaCOG_NA);

const CCAA_LR = new IDEE.layer.GeoJSON({
  name: "Comunidad Autónoma de La Rioja", 
  url: '/source/LA_RIOJA.geojson',
  legend: 'Comunidad Autónoma de La Rioja'
}, { visibility: true });

const CCAA_NA = new IDEE.layer.GeoJSON({
  name: "Comunidad Foral de Navarra", 
  url: '/source/NAVARRA.geojson',
  legend: 'Comunidad Foral de Navarra'
}, { visibility: true });

const UMBRA = new IDEE.layer.GeoJSON({
  name: "Franja de totalidad", 
  url: '/source/UMBRA.geojson',
  legend: 'Franja de totalidad'
}, { visibility: true });

CCAA_LR.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

CCAA_NA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'red', opacity: 0 }, stroke: { color: 'orange', width: 3 } }
}));

UMBRA.setStyle(new IDEE.style.Generic({
polygon: { fill: { color: 'gray', opacity: 0.3 }, stroke: { color: 'white', width: 0.5 } }
}));

CCAA_LR.setZIndex(20);
CCAA_NA.setZIndex(20);
UMBRA.setZIndex(20);
mapa.addLayers(CCAA_LR);
mapa.addLayers(CCAA_NA);
mapa.addLayers(UMBRA);





// ===== wmts =====
//const ORTO_MA = new IDEE.layer.WMTS({
//url: "https://www.ign.es/wmts/pnoa-ma",
//name: "OI.OrthoimageCoverage",
//matrixSet: "EPSG:25830",
//legend: "Ortofoto PNOA máxima actualidad",
//visibility: true
//},
//{
//  format: 'image/png'
//});
//ORTO_MA.setZIndex(1);
//mapa.addLayers(ORTO_MA);


const layerSwitcher = new IDEE.plugin.Layerswitcher({ 
  collapsed: !0, 
  position: "BL", 
  collapsible: !0, 
  isDraggable: !1, 
  modeSelectLayers: "eyes", 
  tools: ["transparency", "legend", "zoom", "style", "delete"], 
  isMoveLayers: !0, 
  https: !0, 
  http: !0, 
  showCatalog: !1, 
});
mapa.addPlugin(layerSwitcher);

function toggleHeaderVisibility() {
  const header = document.getElementById('cabecera-ign');
  if (!header) return;
  const layerswitcherPanel = document.querySelector('.m-plugin-layerswitcher');
  if (!layerswitcherPanel) return;
  const isOpened = layerswitcherPanel.classList.contains('opened');
  header.style.display = isOpened ? 'none' : 'flex';
  header.style.visibility = isOpened ? 'hidden' : 'visible';
  header.style.pointerEvents = isOpened ? 'none' : 'auto';
}

const observer = new MutationObserver(toggleHeaderVisibility);
const panel = document.querySelector('.m-plugin-layerswitcher');
if (panel) {
  observer.observe(panel, { attributes: true, attributeFilter: ['class'] });
}

window.addEventListener('load', function() {
  setTimeout(toggleHeaderVisibility, 100);
});

</script>
</body>
