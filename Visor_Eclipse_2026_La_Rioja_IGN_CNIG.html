<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Visor API‑IDEE – Eclipse 2026 La Rioja</title>

  <!-- ===== CSS API‑IDEE ===== -->
  <link href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet"/>
  <link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet"/>
  <link href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css" rel="stylesheet" />

  <style>
    /* Reset total */
    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column; /* Encabezado arriba, mapa abajo */
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden; /* Evita scrolls dobles */
    }

    /* ===== ENCABEZADO FUERA DEL MAPA ===== */
    #header-institucional {
      flex-shrink: 0; /* Impide que el mapa lo aplaste */
      background-color: #e3f2fd; /* Azul claro suave */
      border-bottom: 5px solid #ffffff; /* Borde blanco */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      position: relative; /* Necesario para el z-index */
      z-index: 9999; /* Valor altísimo para estar sobre el LayerSwitcher */
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      min-height: 100px;
    }

    /* Columnas del encabezado */
    .header-col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-left { flex: 0 0 20%; justify-content: flex-start; }
    .header-center { flex: 0 0 55%; flex-direction: column; gap: 5px; }
    .header-right { flex: 0 0 20%; justify-content: flex-end; }

    /* Logos */
    .logo-header {
      max-height: 85px;
      max-width: 100%;
      width: auto;
      display: block;
    }

    /* Texto */
    .titulo-principal {
      font-size: 16px;
      font-weight: bold;
      color: #003366;
      margin: 0;
      text-align: center;
      line-height: 1.2;
    }

    /* Botón PDF */
    .btn-pdf-header {
      background-color: #d32f2f;
      color: white;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.3s;
    }

    .btn-pdf-header img {
      height: 14px;
      filter: brightness(0) invert(1);
    }

    /* ===== CONTENEDOR DEL MAPA ===== */
    #mapa {
      flex-grow: 1; /* Ocupa todo el resto de la pantalla */
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ADAPTACIÓN MÓVIL (Versión Desktop-like) */
    @media (max-width: 600px) {
      #header-institucional {
        min-height: 80px;
        padding: 5px 10px;
      }
      .logo-header {
        max-height: 50px; /* Reducción proporcional para que no desaparezcan */
      }
      .titulo-principal {
        font-size: 11px;
      }
      .btn-pdf-header {
        padding: 3px 8px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- ENCABEZADO -->
  <header id="header-institucional">
    <!-- Top Left -->
    <div class="header-col header-left">
      <img src="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Imagen_Dele.png" alt="Delegación" class="logo-header">
    </div>

    <!-- Center -->
    <div class="header-col header-center">
      <p class="titulo-principal">Servicio regional del IGN en La Rioja y Navarra</p>
      <a href="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Visivilidad_Sol_ECLIPSE_2026.pdf" target="_blank" class="btn-pdf-header">
        <img src="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/INFO.png" alt="">
        INFO ECLIPSE 2026 (PDF)
      </a>
    </div>

    <!-- Top Right -->
    <div class="header-col header-right">
      <img src="https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/Imagen_IGN.png" alt="IGN" class="logo-header">
    </div>
  </header>

  <!-- MAPA -->
  <div id="mapa" class="m-container"></div>

  <!-- SCRIPTS -->
  <script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
  <script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>
  <script src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
  <script src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

  <script>
    // Inicialización del mapa
    const mapa = IDEE.map({
      container: 'mapa',
      zoom: 9.5,
      minZoom: 8,
      center: [-273000, 5220000], 
      controls: ['scaleline', 'location', 'rotate']
    });

    // Capas
    const CCAA = new IDEE.layer.GeoJSON({
        name: "Límite La Rioja", 
        url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/LA_RIOJA(web_mercator).geojson',
        visibility: true
    });
    CCAA.setStyle(new IDEE.style.Generic({
      polygon: { fill: { color: 'green', opacity: 0 }, stroke: { color: '#FF0000', width: 3 } }
    }));
    
    const capaCOG = new IDEE.layer.GeoTIFF({    
        url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/La_Rioja_Sombra_COG_WM.tif',
        name: 'Sombra Eclipse'
      }, { visibility: true, opacity: 0.8 });

    const ORTO_MA = new IDEE.layer.WMS({
      url: 'https://www.ign.es/wms-inspire/pnoa-ma?',
      name: 'OI.OrthoimageCoverage',
      legend: 'Ortofoto PNOA',
      visibility: true
    });

    mapa.addLayers([ORTO_MA, capaCOG, CCAA]);

    // Plugins
    mapa.addPlugin(new IDEE.plugin.MouseSRS({
      position: 'BL',
      srs: 'EPSG:4326',
      label: 'Lat, Lon',
      precision: 4,
    }));

    mapa.addPlugin(new IDEE.plugin.Layerswitcher({ 
      collapsed: true, 
      position: "TR", 
      collapsible: true, 
      modeSelectLayers: "eyes", 
      showCatalog: false 
    }));
  </script>
</body>
</html>
