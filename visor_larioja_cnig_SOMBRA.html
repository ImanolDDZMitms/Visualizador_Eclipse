<script>
  // ===============================
  // CONFIGURACIÓN DEL MAPA
  // ===============================
  M.proxy(false);

  const mapajs = M.map({
    container: 'mapaJS_div',
    controls: [
      'backgroundlayers',
      'rotate',
      'location',
      'scale',
      'panzoom',
      'panzoombar',
      'scaleline'
    ],
    center: ol.proj.fromLonLat([-2.45, 42.33]),
    zoom: 8
  });

  // ===============================
  // ORTOFOTO PNOA
  // ===============================
  const pnoa = new M.layer.WMS(
    {
      url: 'https://www.ign.es/wms-inspire/pnoa-ma',
      name: 'OI.OrthoimageCoverage',
      legend: 'Ortoimagen PNOA',
      tiled: false,
      visibility: true
    },
    {
      format: 'image/png'
    }
  );

  mapajs.addLayers([pnoa]);
  pnoa.setZIndex(97);

  // ===============================
  // ✅ COG – MDT / SOMBRA LA RIOJA
  // ===============================
  const cogLaRioja = new M.layer.GeoTIFF(
    {
      url: 'source/la_rioja_COG.tif',
      name: 'COG_La_Rioja',
      legend: 'Sombra La Rioja (COG)',
      projection: 'EPSG:3857',
      visibility: true
    },
    {
      opacity: 0.7
    }
  );

  mapajs.addLayers([cogLaRioja]);
  cogLaRioja.setZIndex(96);

  // ===============================
  // PLUGIN SELECTOR DE CAPAS
  // ===============================
  const mp_selectorCapa = new M.plugin.Layerswitcher({
    position: 'TR',
    collapsed: false,
    collapsible: true,
    tooltip: 'Selector de capas',
    showCatalog: true,
    displayLabel: false,
    addLayers: true,
    statusLayers: true,
    modeSelectLayers: 'eyes',
    tools: ['transparency', 'legend', 'zoom', 'information', 'delete']
  });

  mapajs.addPlugin(mp_selectorCapa);
</script>
