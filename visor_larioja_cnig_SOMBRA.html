<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="cnig" content="yes">

  <title>Visor API‑IDEE – La Rioja</title>

  <!-- ===== CSS API‑IDEE ===== -->
  <link rel="stylesheet"
        href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css">

  <!-- ===== CSS Layerswitcher ===== -->
  <link rel="stylesheet"
        href="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

<!-- CONTENEDOR DEL MAPA -->
<div id="mapa" class="m-container"></div>

<!-- ===== JS API‑IDEE (ORDEN CORRECTO) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

<!-- ===== PLUGIN LAYERSWITCHER ===== -->
<script src="https://componentes.idee.es/api-idee/plugins/layerswitcher/layerswitcher.ol.min.js"></script>

<script>
/************************************************
 * 1. CREAR MAPA BASE
 ************************************************/
const mapa = IDEE.map({
  container: 'mapa',
  zoom: 7,
  center: [-273000, 5202000], // La Rioja (EPSG:3857)
  controls: [
    'panzoom',
    'scale*true',
    'scaleline',
    'location',
    'backgroundlayers'
  ]
});

/************************************************
 * 2. CAPA PNOA (VISIBLE CLARA)
 ************************************************/
const pnoa = new IDEE.layer.WMS(
  {
    url: 'https://www.ign.es/wms/pnoa-historico?',
    name: 'PNOA',
    legend: 'Ortofoto PNOA',
    tiled: true
  },
  {
    visibility: true
  }
);

mapa.addLayers(pnoa);

/************************************************
 * 3. LAYERSWITCHER
 ************************************************/
const layerswitcher = new IDEE.plugin.Layerswitcher({
  collapsed: false,
  collapsible: true
});

mapa.addPlugin(layerswitcher);

</script>

</body>
</html>
