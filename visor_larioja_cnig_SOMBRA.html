<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="cnig" content="yes">

  <title>Visor API‑IDEE – La Rioja</title>

  <!-- ===== CSS API‑IDEE ===== -->
  <link rel="stylesheet"
        href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css">

  <!-- ===== MOUSE SRS ===== -->
  <link href="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs-1.0.0.ol.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

<!-- CONTENEDOR DEL MAPA -->
<div id="mapa" class="m-container"></div>

<!-- ===== JS API‑IDEE (ORDEN CORRECTO) ===== -->
<script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
<script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
<script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>


<!-- ===== PLUGIN MOUSERSRS ===== -->
<script type="text/javascript" src="https://componentes.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>

<script>
/************************************************
 * 1. MAPA BASE
 ************************************************/
const mapa = IDEE.map({
  container: 'mapa',
  zoom: 10,
  maxZoom: 10,
  minZoom: 16,
  center: [-273000, 5202000], // La Rioja (EPSG:3857)
  controls: [
    'panzoom',
    'scale*true',
    'scaleline',
    'location',
    'backgroundlayers'
  ]
});

/************************************************
 * 2. COG DIRECTO SOBRE EL MAPA
 ************************************************/
const capaCOG = new IDEE.layer.GeoTIFF(
  {
    
    url: 'https://visualizador-eclipse-2026-ign-cnig.vercel.app/source/salida_3857_COG_visual.tif',

    name: 'Visibilidad La Rioja',
    legend: 'Visibilidad La Rioja'
  },
  {
    visibility: true
  }
);

// Por delante en index 10, index 0 (al fondo)
capaCOG.setZIndex(10);
capaCOG.setOpacity(0.5)
mapa.addLayers(capaCOG);

/************************************************
 * 3. COORDENADAS
 ************************************************/

 const mp = new IDEE.plugin.MouseSRS({
  position: 'BL',
  tooltip: 'Muestra coordenadas',
  srs: 'EPSG:4326',
  label: 'WGS84',
  precision: 4,
});
mapa.addPlugin(mp);



</script>

</body>
</html>
